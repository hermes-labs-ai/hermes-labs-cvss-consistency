[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-cvss-consistency"
version = "0.1.0"
description = "Offline CVE record checker for stored CVSS 3 score/vector consistency"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Hermes Labs", email = "roli@hermes-labs.ai"}]
dependencies = ["cvss==3.6"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
hermes-cvss-consistency = "hermes_cvss_consistency.__main__:main"

[project.urls]
Homepage = "https://hermes-labs.ai/case-studies/cisa-vulnrichment-score-consistency"
Repository = "https://github.com/hermes-labs-ai/hermes-cvss-consistency"
Issues = "https://github.com/hermes-labs-ai/hermes-cvss-consistency/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-labs-cvss-consistency"
version = "0.1.0"
description = "Offline CVE record checker for stored CVSS 3 score/vector consistency"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Hermes Labs", email = "roli@hermes-labs.ai"}]
keywords = [
    "cve", "cvss", "vulnerability-management", "security-tools",
    "data-quality", "static-analysis", "offline-first", "cisa-vulnrichment",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = ["cvss==3.6"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff"]

[project.scripts]
hermes-labs-cvss-consistency = "hermes_labs_cvss_consistency.__main__:main"

[project.urls]
Homepage = "https://hermes-labs.ai/case-studies/cisa-vulnrichment-score-consistency"
Repository = "https://github.com/hermes-labs-ai/hermes-labs-cvss-consistency"
Issues = "https://github.com/hermes-labs-ai/hermes-labs-cvss-consistency/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".hermes"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
